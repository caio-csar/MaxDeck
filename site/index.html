<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Central de instalação e atualização dos scripts Tampermonkey." />
    <title>MaxDeck — Scripts Tampermonkey</title>
    <style>
      :root{--ink:#18201d;--muted:#637169;--cream:#f7f4ed;--line:#dbe1d8;--green:#176b52}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:Arial,Helvetica,sans-serif}.hero{max-width:1100px;margin:auto;padding:92px 32px 76px;text-align:center}.eyebrow,.section-label{margin:0;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.14em}h1{max-width:760px;margin:15px auto;font:500 clamp(44px,7vw,76px)/.98 Georgia,serif;letter-spacing:-.055em}.hero>p{max-width:560px;margin:25px auto;color:var(--muted);font-size:18px;line-height:1.55}.how{display:flex;justify-content:center;gap:16px;margin-top:34px;font-size:14px;font-weight:700}.how i{color:#8c9a92;font-style:normal}.catalog{padding:62px max(32px,calc((100vw - 1100px)/2)) 86px;background:#fff}.top{display:flex;justify-content:space-between;align-items:end;gap:24px}h2{margin:7px 0 0;font:500 38px Georgia,serif;letter-spacing:-.04em}.search{width:280px;display:flex;gap:9px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:9px}.search span{font-size:21px;color:var(--green)}input{width:100%;border:0;outline:0;font-size:14px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:42px}.filters button{padding:9px 16px;border:1px solid var(--line);border-radius:99px;background:#fff;color:#506058;cursor:pointer}.filters button.active{background:var(--ink);border-color:var(--ink);color:#fff}.count{margin:25px 0 17px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{min-height:190px;padding:21px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;background:#fff;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#a9cdbb;box-shadow:0 10px 24px #1c4d3810}.card.featured{background:linear-gradient(135deg,#f6fcf7,#eaf7ef);border-color:#b9dfc8}.head{display:flex;justify-content:space-between;gap:8px}.tag,.main{color:var(--green);font-size:10px;font-weight:800;letter-spacing:.08em}.main{padding:5px 7px;border-radius:4px;background:#c7efd9}.card h3{margin:19px 0 7px;font-size:17px;line-height:1.25;letter-spacing:-.02em}.card p{margin:0;color:var(--muted);font-size:13px}.card a{display:flex;justify-content:space-between;align-items:center;margin-top:auto;color:var(--green);font-size:14px;font-weight:750;text-decoration:none}.card a span{font-size:18px}.empty{padding:45px 0;color:var(--muted);text-align:center}@media(max-width:760px){.hero{padding:64px 24px}.catalog{padding:42px 22px 60px}.top{align-items:start;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}.how{gap:8px;font-size:12px}}
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="eyebrow">CENTRAL DE FERRAMENTAS</p>
        <h1>Scripts que deixam o trabalho fluir.</h1>
        <p>Instale, encontre e mantenha suas automações Tampermonkey sempre atualizadas em um único lugar.</p>
        <div class="how"><span>1. Escolha</span><i>→</i><span>2. Instale</span><i>→</i><span>3. Receba atualizações</span></div>
      </section>
      <section class="catalog">
        <div class="top"><div><p class="section-label">CATÁLOGO</p><h2>Encontre o que precisa</h2></div><label class="search"><span>⌕</span><input id="search" placeholder="Buscar script" aria-label="Buscar script" /></label></div>
        <div class="filters" id="filters"></div><p class="count" id="count"></p><div class="grid" id="grid"></div><p class="empty" id="empty" hidden>Nenhum script encontrado.</p>
      </section>
    </main>
    <script>
      const favorites=["TendiChat - Relato GPT","Painel Maxdata - Boneco Pendentes Estavel","Max Painel - Ultra Modern UI (Stripe Style)","TendiChat - Semáforo de CNPJ por Ticket","Autocorretor TendiChat"];
      const group=n=>/TendiChat|Tendichat/.test(n)?"TendiChat":/Max|Maxdata/.test(n)?"MaxAtendimento":"Outros";
      let all=[],current="Todos";const filters=document.querySelector('#filters'),grid=document.querySelector('#grid'),count=document.querySelector('#count'),empty=document.querySelector('#empty');
      function render(){const q=document.querySelector('#search').value.toLowerCase();const list=all.filter(x=>(current==="Todos"||group(x.name)===current)&&x.name.toLowerCase().includes(q)).sort((a,b)=>favorites.includes(b.name)-favorites.includes(a.name));count.textContent=`${list.length} scripts disponíveis`;grid.innerHTML=list.map(x=>`<article class="card ${favorites.includes(x.name)?'featured':''}"><div class="head"><span class="tag">${group(x.name)}</span>${favorites.includes(x.name)?'<span class="main">PRINCIPAL</span>':''}</div><h3>${x.name.replace(/^z+_?/,"")}</h3><p>Versão ${x.version}</p><a href="scripts/${encodeURIComponent(x.file)}">Instalar script <span>→</span></a></article>`).join('');empty.hidden=Boolean(list.length)}
      ["Todos","TendiChat","MaxAtendimento","Outros"].forEach(x=>{const b=document.createElement('button');b.textContent=x;b.className=x===current?'active':'';b.onclick=()=>{current=x;[...filters.children].forEach(y=>y.classList.toggle('active',y===b));render()};filters.append(b)});document.querySelector('#search').oninput=render;fetch('catalog.json').then(r=>r.json()).then(data=>{all=data.filter(x=>x.enabled!==false);render()});
    </script>
  </body>
</html>
